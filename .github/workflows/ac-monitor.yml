name: AC Monitor

on:
  push:
    branches: [ "claude/geneva-ac-search-playwright-bfrfir" ]
    paths: [ "scripts/ac-search/monitor.mjs", ".github/workflows/ac-monitor.yml" ]
  workflow_dispatch:
  schedule:
    - cron: '13 */2 * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run monitor
        run: node scripts/ac-search/monitor.mjs
